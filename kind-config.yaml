kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: local
networking:
  ipFamily: ipv4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Minio (Object Storage)
  - containerPort: 9000
    hostPort: 9000
    protocol: TCP
  - containerPort: 9001
    hostPort: 9001
    protocol: TCP
  # Nessie (Iceberg Catalog)
  - containerPort: 19120
    hostPort: 19120
    protocol: TCP
  # Trino (Distributed SQL Query Engine)
  - containerPort: 8080
    hostPort: 8080
    protocol: TCP
  # Snowflake Emulator
  - containerPort: 8081
    hostPort: 8081
    protocol: TCP
  # Dagster (Data Orchestration)
  - containerPort: 3000
    hostPort: 3000
    protocol: TCP
  - containerPort: 4000
    hostPort: 4000
    protocol: TCP
  - containerPort: 4266
    hostPort: 4266
    protocol: TCP
  # Ingress Controller (HTTP/HTTPS)
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Windmill (Developer Platform)
  - containerPort: 80
    hostPort: 8082
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
  - containerPort: 8000
    hostPort: 8001
    protocol: TCP
# Worker nodes for better resource allocation
- role: worker
- role: worker
- role: worker
- role: worker
- role: worker
- role: worker
- role: worker